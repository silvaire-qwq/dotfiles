# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# | Silvaire's Own Hyprland Config        |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


#----------------------------------
#  1. Color
#----------------------------------

# Primary Color
$hyprMainColor = $lavenderAlpha 

#----------------------------------
#  2. Waybar Color
#----------------------------------

# Font Color
env = WaybarFont,$textAlpha
# 1st Background
env = WaybarBG,rgba(30, 30, 46, 0.8)
# 2nd Background
env = WaybarSC,rgba(49, 50, 68, 0.6)
# 2nd Border
env = WaybarSB,rgba(69, 71, 90, 0.6)


#----------------------------------
#  3. Border
#----------------------------------

# Border Color of Inactive Window(s)
$BorderInactiveCol = $surface1
# Border Size
$BorderSize = 1

#----------------------------------
#  4. Opacity
#----------------------------------

# Opacity of Active Window
$Opacity = 0.7
# Opacity of Inactive Window(s)
$InOpacity = 0.7

#----------------------------------
#  5. Gaps
#----------------------------------

# Padding (Between 2 Windows)
$GapsIn = 0 #4
# Margin
$GapsOut = 0 #13

#----------------------------------
#  6. Blur
#----------------------------------

# Blur Size
$BlurSize = 9
# Blur Passes
$BlurPasses = 3
# Frosted Glass
$BlurNoise = 0

#----------------------------------
#  7. Border Radius
#----------------------------------

# Border Radius
$Rounding = 0 #12

#----------------------------------
#  8. Defaults
#----------------------------------

# Terminal
$Terminal = wezterm
# Application Menu
$Launcher = rofi -show drun
# Explorer
$Explorer = nautilus

